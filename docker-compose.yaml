version: "3.9"

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"   
      - "8025:8025"   
    restart: unless-stopped
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lincyDB@123
      POSTGRES_DB: saleor_docker
    ports:
      - "5432:5432"
    volumes:
      - saleor_db_data:/var/lib/postgresql/data

  saleor-backend:
    build:
      context: ./saleor
    container_name: saleor-backend
    working_dir: /app
    mem_limit: 4g
    mem_reservation: 2g
    env_file:
      - ./saleor/.env
    ports:
      - "8000:8000"
    
    command: >
      bash -c "
        poetry run python manage.py migrate &&
        poetry run python manage.py collectstatic --noinput &&
        poetry run uvicorn saleor.asgi:application --host 0.0.0.0 --port 8000
      "
    volumes:
      - ./saleor:/app
    depends_on:
      - saleor-redis
      - db
      - mailpit
    environment:
      REDIS_URL: redis://saleor-redis:6379/0
      DATABASE_URL: postgres://postgres:lincyDB%40123@db:5432/saleor_docker
      USER_EMAIL_HOST: mailpit
      USER_EMAIL_PORT: 1025
      USER_EMAIL_USE_TLS: "False"
      USER_EMAIL_USE_SSL: "False"
      USER_EMAIL_SENDER_NAME: "Saleor Admin"
      USER_EMAIL_SENDER_ADDRESS: "admin@example.com"
      POETRY_VIRTUALENVS_CREATE: "false"
  saleor-dashboard:
    build:
      context: ./saleor-dashboard
    container_name: saleor-dashboard
    env_file:
      - ./saleor-dashboard/.env
    ports:
      - "9000:80"
    stdin_open: true
    tty: true
    depends_on:
      - saleor-backend

  saleor-redis:
    image: redis:7-alpine
    container_name: saleor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  saleor_db_data:
