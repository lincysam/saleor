# nginx/default.conf - Single vendor setup
server {
    listen 80;
    server_name vendor1.localhost localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Proxy GraphQL requests to backend
    location /graphql/ {
        proxy_pass http://saleor-backend:8000/graphql/;
        proxy_set_header Host vendor1.localhost;  # This tells Saleor to use vendor1 schema
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' 'http://vendor1.localhost:8080' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}